<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaminari Chat</title>
    <link rel="icon" type="image/jpeg" href="/kaminari-logo.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00f3ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kaminari Chat" />
    <link rel="apple-touch-icon" href="/kaminari-logo.jpg" />
    <meta name="description" content="Electric cyberpunk real-time chat with 3D lightning visualizers, stories, and WebRTC calling." />
    <meta property="og:title" content="Kaminari Chat" />
    <meta property="og:description" content="Electric cyberpunk real-time chat with 3D lightning visualizers, stories, and WebRTC calling." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0d0d12] text-slate-100 antialiased selection:bg-cyan-500 selection:text-black overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('Kaminari PWA Service Worker registered:', reg.scope);
          }).catch((err) => {
            console.log('Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
